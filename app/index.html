<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Missions">
<title>Zaha Missions — Service</title>
<style>
:root{
  --clay:#C24B3A; --clay6:#D49A86; --warmstone:#E7E2DA; --sand:#F4F2EE;
  --mist:#EDEDED; --charcoal:#222222; --stone:#C4C4C0;
  --pass:#2F6B4F; --warn:#B07A1E; --fail:#9B2C20;
  --font:"Neue Haas Grotesk Display Pro","Neue Haas Grotesk","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sand);-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--charcoal);-webkit-font-smoothing:antialiased}
button{font-family:inherit;-webkit-tap-highlight-color:rgba(194,75,58,.18)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column}

/* top bar */
.bar{height:78px;flex:none;background:#fff;border-bottom:1px solid var(--mist);
  display:flex;align-items:center;gap:16px;padding:0 20px;padding-top:env(safe-area-inset-top)}
.bar{gap:14px}
.bar svg{width:68px;height:auto;fill:var(--charcoal);display:block;overflow:visible}
.sep{width:1px;height:26px;background:var(--stone)}
.area{font-size:17px;font-weight:500}
.tag{display:inline-block;background:var(--charcoal);color:#fff;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;margin-left:7px;vertical-align:middle}
.sub{font-size:13px;font-weight:300;color:#6d6a65}
.spacer{flex:1}

/* columns */
.cols{flex:1;display:flex;gap:16px;padding:16px 20px;min-height:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.chead{display:flex;align-items:center;gap:10px;padding-bottom:10px;
  border-bottom:2px solid var(--charcoal);margin-bottom:12px;flex:none}
.cname{font-size:16px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;flex:1}
.cprog{font-size:13px;font-weight:300;color:#7a7771;font-variant-numeric:tabular-nums}
.cbar{width:52px;height:6px;background:var(--mist);flex:none;position:relative;overflow:hidden}
.cbar i{position:absolute;left:0;top:0;bottom:0;background:var(--clay);display:block}

.hero{background:#fff;border:2px solid var(--clay);padding:14px 16px;flex:none;margin-bottom:16px;
  text-align:left;width:100%;cursor:pointer;display:block}
.hero.late{border-color:var(--fail)}
.htag{display:inline-block;background:var(--clay);color:#fff;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:500;padding:4px 9px;margin-bottom:9px}
.hero.late .htag{background:var(--fail)}
.htitle{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;line-height:1.15}
.hmeta{display:block;font-size:13px;font-weight:300;color:#5c5955;margin:0 0 12px}
.hgo{display:block;background:var(--clay);color:#fff;font-size:15px;font-weight:500;
  height:44px;line-height:44px;text-align:center}
.hero.late .hgo{background:var(--fail)}
.hero.none{border-color:var(--pass);cursor:default}
.hero.none .htag{background:var(--pass)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding-right:3px}
.glab{display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:400;color:#8a8681;margin:0 0 7px}
.glab .ln{flex:1;height:1px;background:var(--mist)}
.row{background:#fff;border:1px solid var(--mist);display:flex;align-items:center;gap:11px;
  padding:0 13px;height:46px;margin-bottom:6px;width:100%;text-align:left;cursor:pointer}
.row.done{background:#F7F6F3;border-color:#E5E2DC}
.row.late{border-color:var(--fail);border-left:3px solid var(--fail)}
.rt{width:42px;flex:none;font-size:12px;font-weight:500;color:#5c5955;font-variant-numeric:tabular-nums}
.row.done .rt{color:#9a9691;font-weight:300}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--stone)}
.dot.pass{background:var(--pass)} .dot.fail{background:var(--fail)} .dot.warn{background:var(--warn)}
.rn{font-size:14px;font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .rn{color:#8a8681}
.rm{font-size:11px;font-weight:300;color:#8a8681;flex:none}
.fold{display:flex;align-items:center;gap:8px;background:none;border:1px dashed var(--stone);
  width:100%;padding:9px 12px;margin-bottom:8px;cursor:pointer;font-size:12px;font-weight:300;color:#7a7771}

/* reminder */
.rem{flex:none;border-top:1px solid var(--mist);background:#fff;padding:9px 20px;
  display:flex;align-items:center;gap:11px;font-size:13px}
.rem svg{width:16px;height:16px;stroke:#8a8681;fill:none;stroke-width:1.6;flex:none}
.rem .d{margin-left:auto;font-weight:300;color:#8a8681;font-size:12px}

/* detail sheet */
.sheet{position:fixed;inset:0;background:var(--sand);display:none;z-index:20;
  align-items:stretch}
.sheet.open{display:flex}
.panel{background:var(--sand);width:100%;display:flex;flex-direction:column}
.phead{background:#fff;border-bottom:1px solid var(--mist);padding:18px 22px;flex:none}
.pback{background:none;border:1px solid var(--stone);padding:8px 13px;font-size:13px;color:#5c5955;cursor:pointer;margin-bottom:12px}
.ptitle{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.pmeta{font-size:13px;font-weight:300;color:#6d6a65;margin:0}
.pintro{background:#FBEEEB;border-left:3px solid var(--clay);padding:12px 15px;margin:14px 22px 0;
  font-size:13px;font-weight:300;line-height:1.55}
.pbody{flex:1;overflow-y:auto;padding:14px 22px 20px}
.step{background:#fff;border:1px solid var(--mist);display:flex;align-items:center;gap:12px;
  padding:0 14px;min-height:56px;margin-bottom:7px}
.box{width:26px;height:26px;border:2px solid var(--stone);flex:none}
.box.photo{border-color:var(--clay);border-style:dashed;background:#FBEEEB}
.stext{font-size:15px;font-weight:300;flex:1;padding:10px 0;line-height:1.4}
.pq{width:34px;height:34px;flex:none;border:1px solid var(--stone);background:none;
  border-radius:50%;font-size:14px;color:#6d6a65;cursor:pointer}
.cam{font-size:11px;font-weight:500;color:var(--clay);flex:none;letter-spacing:.06em;text-transform:uppercase}
.guide{background:var(--warmstone);padding:11px 14px;margin:-3px 0 7px;font-size:13px;
  font-weight:300;line-height:1.55;display:none}
.guide p{margin:0 0 9px}
.guide img{max-width:100%;display:block;border:1px solid rgba(0,0,0,.08)}
.guideimg{max-width:100%;display:block;margin:-3px 0 7px;border:1px solid var(--mist)}
.guide.open{display:block}
.unit{background:#fff;border:1px solid var(--mist);display:flex;align-items:center;gap:12px;
  padding:0 14px;height:56px;margin-bottom:7px}
.uname{font-size:15px;font-weight:400;flex:1}
.ulim{font-size:12px;font-weight:300;color:#6d6a65}
.pfoot{flex:none;background:#fff;border-top:1px solid var(--mist);padding:14px 22px}
.notyet{background:var(--warmstone);padding:12px 15px;font-size:13px;font-weight:300;line-height:1.5}

.msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;text-align:center;padding:40px;background:var(--sand);z-index:30}
.msg h2{font-size:22px;font-weight:500;margin:0}
.msg p{font-size:15px;font-weight:300;color:#5c5955;margin:0;max-width:44ch;line-height:1.6}
.msg.hide{display:none}
/* ---- completion flow ---- */
.step.on{background:#F7F6F3;border-color:#E5E2DC}
.box{display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;padding:0}
.box.on{background:var(--pass);border-color:var(--pass)}
.box.on svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3}
.box[disabled]{cursor:not-allowed;opacity:.9}
.shot{font-size:11px;font-weight:500;color:var(--pass);letter-spacing:.06em;text-transform:uppercase;flex:none}
.needphoto{background:var(--clay);color:#fff;border:none;cursor:pointer;font-size:13px;
  font-weight:500;padding:11px 14px;min-height:44px;flex:none}
.signbtn{width:100%;background:var(--charcoal);color:#fff;border:none;cursor:pointer;
  font-size:17px;font-weight:500;height:56px}
.signbtn.off{background:var(--mist);color:#9a9691;cursor:not-allowed}
.unit{flex:1;min-width:0;text-align:left;cursor:pointer}
.unitrow{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.unitrow .pqs{align-self:stretch;height:auto}
.unitrow .unit{margin-bottom:0}
.unit.pass{border-color:var(--pass);border-left:4px solid var(--pass)}
.unit.fail{border-color:var(--fail);border-left:4px solid var(--fail);background:#FBF0EF}
.unit.skip{border-left:4px solid var(--stone);background:#FAF9F7}
.unit.skip .uname{color:#8a8681}
.unit.skip .uval{color:#9a9691;font-size:14px;font-weight:400}
.padna{width:100%;margin-top:9px;background:#fff;border:1px solid var(--stone);
  height:46px;font-size:15px;color:#5c5955;cursor:pointer;font-family:inherit}
.reasons{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.reasons .opt.big{font-size:18px;font-weight:500;padding:22px 18px;width:100%}
.reasons .opt{width:100%;min-height:52px;font-size:16px}
.uval{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;flex:none;color:#9a9691}
.unit.pass .uval{color:var(--pass)} .unit.fail .uval{color:var(--fail)}

/* ---- overlays: keypad, PIN, done ---- */
.ov{position:fixed;inset:0;background:rgba(34,34,34,.55);z-index:40;
  display:flex;align-items:center;justify-content:center;padding:24px}
.pad{background:var(--sand);width:min(420px,100%);padding:22px}
.padh{text-align:center;margin-bottom:18px}
.padname{font-size:21px;font-weight:600;margin-bottom:3px}
.padlim{font-size:13px;font-weight:300;color:#6d6a65}
.padnum{font-size:62px;font-weight:700;letter-spacing:-.03em;line-height:1.1;
  font-variant-numeric:tabular-nums;margin-top:8px}
.padnum small{font-size:26px;font-weight:300}
.verdict{display:inline-block;font-size:15px;font-weight:600;padding:7px 15px;margin-top:9px}
.verdict.pass{background:#E8F0EB;color:var(--pass)}
.verdict.fail{background:#F6E5E3;color:var(--fail)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{font-size:25px;font-weight:300;height:62px;background:#fff;border:1px solid var(--mist);
  cursor:pointer;color:var(--charcoal)}
.key.wide{grid-column:span 2}
.key.save{background:var(--pass);color:#fff;border-color:var(--pass);font-size:17px;font-weight:500}
.key.save.off{background:var(--mist);color:#9a9691;border-color:var(--mist)}
.key.ghost{font-size:14px;font-weight:400;color:#6d6a65}
.padcancel{width:100%;margin-top:9px;background:none;border:1px solid var(--stone);
  height:46px;font-size:15px;color:#5c5955;cursor:pointer}
.dots{display:flex;gap:12px;justify-content:center;margin-top:16px}
.dot2{width:15px;height:15px;border-radius:50%;border:2px solid var(--stone)}
.dot2.on{background:var(--charcoal);border-color:var(--charcoal)}

/* ---- corrective action ---- */
.alert{background:var(--fail);color:#fff;padding:16px 22px;flex:none}
.alertt{font-size:19px;font-weight:600;margin-bottom:3px}
.alerts{font-size:14px;font-weight:300;opacity:.92}
.calead{font-size:14px;font-weight:300;color:#5c5955;margin:0 0 14px}
.known{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:20px}
.known>div{background:#fff;border:1px solid var(--mist);padding:11px 13px}
.known span{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#8a8681;margin-bottom:4px}
.known b{display:block;font-size:15px;font-weight:500}
.known i{display:block;font-size:11px;font-style:normal;color:#8a8681;margin-top:2px}
.tiny{background:none;border:none;color:var(--clay);font-size:11px;cursor:pointer;
  text-decoration:underline;padding:4px 0 0}
.ask{margin-bottom:18px}
.asklab{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:#7a7771;margin-bottom:8px}
.opts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.opt{font-size:14px;padding:11px 14px;background:#fff;border:1px solid var(--mist);
  cursor:pointer;color:var(--charcoal);min-height:44px}
.opt.on{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.inp{width:100%;border:1px solid var(--mist);background:#fff;padding:12px 13px;
  font-size:15px;font-family:inherit}

/* ---- done ---- */
.donebox{background:var(--sand);padding:36px 44px;text-align:center;width:min(380px,100%)}
.tickc{width:78px;height:78px;border-radius:50%;background:var(--pass);margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center}
.tickc.warn{background:var(--warn)}
.tickc svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:2.6}
.donebox h2{font-size:26px;font-weight:700;margin:0 0 6px}
.donebox p{font-size:14px;font-weight:300;color:#5c5955;margin:0}
.warnline{margin-top:10px !important;color:var(--warn) !important}
/* Overdue lives on the row itself now, not in a banner above the board.
   ONE row pulses — the oldest. If six pulse, none of them reads as urgent,
   which is exactly the habit this system exists to break. */
.row2.late{border:2px solid var(--fail);border-left:6px solid var(--fail);padding:0 13px 0 10px}
.row2.late .t2{color:var(--fail)}
.lateage{flex:none;font-size:13px;font-weight:600;color:var(--fail);letter-spacing:.01em}
.row2.late.worst{background:#FBF1EF;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{background:#FBF1EF}50%{background:#F2D6D1}}
@media (prefers-reduced-motion:reduce){ .row2.late.worst{animation:none;background:#F2D6D1} }

/* Step back only what is NOT urgent. Never dim something that is itself
   late — that would hide the very things being shouted about. */
.cols.hasLate .row2:not(.late){opacity:.45}
.cols.hasLate .glab2{opacity:.45}
.cols.hasLate .glab2.gnow{opacity:1}
/* if everything outstanding is late, dimming says nothing — switch it off */
.cols.allLate .row2, .cols.allLate .glab2{opacity:1}
.resetbtn{margin-left:14px;background:none;border:1px dashed var(--stone);color:#8a8681;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;cursor:pointer;
  font-family:inherit;flex:none}
.ta{min-height:110px;resize:vertical;line-height:1.5}
.shotrow{background:#E8F0EB;color:var(--pass);padding:12px 15px;font-size:14px;font-weight:500}
.remtext b{font-weight:500}
.areaname{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
/* The time is the thing the whole board is measured against — "is 12:00
   soon?" is unanswerable without it. Big enough to read from the pass. */
.nowbox{flex:none;text-align:right;line-height:1.02;margin-right:4px}
.bigclock{font-size:38px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--charcoal)}
.nowbox .sub{margin-top:2px}
.areaname.away{color:var(--clay)}
.switchbtn{background:none;border:1px solid var(--stone);color:#6d6a65;font-size:13px;
  padding:10px 14px;cursor:pointer;font-family:inherit;flex:none;min-height:44px}
/* Reporting a problem cannot live in a scrolling list — a broken fridge
   is found at the worst moment. It sits in the bar, always on screen. */
.probbtn{background:#fff;border:2px solid var(--fail);color:var(--fail);
  font-size:14px;font-weight:600;padding:0 16px;height:44px;margin-right:9px;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px}
.probbtn::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--fail)}
.probbtn:active{background:var(--fail);color:#fff}
.probbtn:active::before{background:#fff}
.pickw{padding:22px}
.pickw h3{font-size:19px;font-weight:600;margin:0 0 4px}
.pickw p{font-size:14px;font-weight:300;color:#5c5955;margin:0 0 16px}
/* free text behind an "Other" option */
.otherin{margin-top:9px}
[hidden]{display:none !important}
.viewbar{flex:none;display:flex;align-items:center;gap:12px;padding:10px 20px;
  background:var(--clay);color:#fff}
.viewbar b{font-size:15px;font-weight:600}
.viewbar span{font-size:13px;font-weight:300;opacity:.92}
.vbtn{margin-left:auto;background:#fff;color:var(--clay);border:none;font-family:inherit;
  font-size:14px;font-weight:500;padding:10px 16px;cursor:pointer;min-height:44px;flex:none}
.floorpick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.paircode{font-size:30px;font-weight:600;letter-spacing:.2em;text-align:center;
  border:2px solid var(--stone);background:#fff;padding:15px 16px;width:min(330px,100%);
  font-family:inherit;text-transform:uppercase;margin:8px 0 14px;color:var(--charcoal)}
.paircode:focus{outline:none;border-color:var(--clay)}
.pairerr{background:#F6E5E3;color:var(--fail);padding:11px 16px;font-size:14px;margin:4px 0 12px;
  max-width:44ch}
.pairhelp{font-size:13px;font-weight:300;color:#8a8681;max-width:46ch;margin-top:18px;line-height:1.6}
.clockwarn{flex:none;background:#F7EFDD;color:var(--warn);padding:9px 20px;font-size:13px;
  text-align:center;font-weight:400}
.bigbtn{background:var(--charcoal);color:#fff;border:none;font-family:inherit;
  font-size:19px;font-weight:500;padding:22px 40px;cursor:pointer;min-width:200px}
.netstate{flex:none;padding:9px 20px;font-size:13px;font-weight:400;text-align:center}
.netstate.off{background:var(--charcoal);color:#fff}
.netstate.sync{background:#F7EFDD;color:var(--warn)}
.tickc.offl{background:var(--charcoal)}

/* ---- UX pass: time-based groups, targets a wet hand can hit ---- */
.gnow{color:var(--clay)} .gnext{color:var(--charcoal)} .glater{color:#9a9691}
.glab2{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:700;margin:15px 0 7px}
.glab2 .ln{flex:1;height:2px;background:currentColor;opacity:.25}
.row2{background:#fff;border:1px solid var(--mist);display:flex;align-items:center;gap:13px;
  padding:0 14px;height:62px;margin-bottom:7px;width:100%;text-align:left;cursor:pointer}
.row2.now{border:2px solid var(--clay);padding:0 13px}
.row2.dim{opacity:.62}
.row2.done{background:#F5F4F1;border-color:#E5E2DC;cursor:default}
.row2 .t2{width:56px;flex:none;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.row2.dim .t2,.row2.done .t2{font-weight:400;color:#8a8681}
.row2 .n2{flex:1;min-width:0;font-size:16px;font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row2.done .n2{font-weight:300;color:#8a8681}
.row2 .go2{background:var(--clay);color:#fff;font-size:13px;font-weight:600;padding:10px 15px;flex:none}
.row2.late .go2{background:var(--fail)}
.tick2{width:26px;height:26px;border-radius:50%;background:var(--pass);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center}
.tick2 svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3}
.ctrack{height:10px;background:var(--mist);position:relative;overflow:hidden;margin-top:7px}
.ctrack i{position:absolute;inset:0 auto 0 0;background:var(--pass);display:block}
.chead2{margin-bottom:13px;flex:none}
.ctop{display:flex;align-items:baseline;gap:10px}
.cname2{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;flex:1}
.ccount{font-size:15px;font-weight:600;color:#5c5955;font-variant-numeric:tabular-nums}

/* steps a wet hand can hit */
.step2{background:#fff;border:1px solid var(--mist);display:flex;align-items:center;gap:15px;
  padding:0 16px;min-height:78px;margin-bottom:8px;width:100%;text-align:left;cursor:pointer}
.step2.on{background:#F3F7F4;border-color:#CFE0D5}
.snum{font-size:13px;font-weight:700;color:#b5b1ab;width:18px;flex:none}
.sbox{width:42px;height:42px;border:2.5px solid var(--stone);flex:none;display:flex;
  align-items:center;justify-content:center;background:#fff}
.sbox.on{background:var(--pass);border-color:var(--pass)}
.sbox.on svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:3}
.sbox.cam{border-color:var(--clay);border-style:dashed;background:#FBEEEB}
.stx2{flex:1;font-size:17px;font-weight:400;line-height:1.35}
.scam{background:var(--clay);color:#fff;border:none;font-family:inherit;font-size:13px;
  font-weight:600;padding:14px 16px;flex:none;cursor:pointer;min-height:48px}
.pqs{width:44px;height:44px;flex:none;border:1px solid var(--stone);background:none;
