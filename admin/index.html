<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missions — back end</title>
<style>
:root{
  --clay:#C24B3A; --clay6:#D49A86; --warmstone:#E7E2DA; --sand:#F4F2EE;
  --mist:#EDEDED; --charcoal:#222222; --stone:#C4C4C0;
  --pass:#2F6B4F; --warn:#B07A1E; --fail:#9B2C20;
  --font:"Neue Haas Grotesk Display Pro","Neue Haas Grotesk","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sand)}
body{font-family:var(--font);color:var(--charcoal);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}

/* shell */
.wrap{display:flex;min-height:100vh}
.side{width:210px;flex:none;background:#fff;border-right:1px solid var(--mist);padding:20px 0;
  position:sticky;top:0;height:100vh;align-self:flex-start}
.side .brand{padding:0 18px 20px}
.side .brand svg{width:72px;height:auto;fill:var(--charcoal);display:block}
.nav{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:11px 18px;font-size:14px;font-weight:300;color:#5c5955;border-left:3px solid transparent}
.nav.on{background:#FBEEEB;border-left-color:var(--clay);color:var(--charcoal);font-weight:500}
.nav .badge{background:var(--fail);color:#fff;font-size:11px;padding:2px 7px;margin-left:7px}
.side .who{position:absolute;bottom:0;left:0;width:210px;padding:14px 18px;
  border-top:1px solid var(--mist);background:#fff;font-size:12px;font-weight:300;color:#7a7771}
.side .who button{background:none;border:none;color:var(--clay);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}

.main{flex:1;min-width:0;padding:26px 30px 60px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.sub{font-size:14px;font-weight:300;color:#6d6a65;margin:0 0 22px}

/* stats */
.stats{display:flex;gap:13px;margin-bottom:26px;flex-wrap:wrap}
.stat{flex:1;min-width:130px;background:#fff;border:1px solid var(--mist);padding:16px 18px}
.stat.bad{border:2px solid var(--fail);padding:15px 17px}
.statn{font-size:34px;font-weight:700;line-height:1;margin-bottom:5px;font-variant-numeric:tabular-nums}
.statn.fail{color:var(--fail)} .statn.warn{color:var(--warn)} .statn.pass{color:var(--pass)}
.statl{font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:300;color:#7a7771}

.glab{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:400;color:#8a8681;margin:26px 0 10px}
.glab .ln{flex:1;height:1px;background:var(--mist)}

/* rows */
.row{background:#fff;border:1px solid var(--mist);display:flex;align-items:center;gap:14px;
  padding:0 16px;height:52px;margin-bottom:6px;width:100%;text-align:left;cursor:pointer}
.row.flat{cursor:default}
.row.bad{border-left:3px solid var(--fail)}
.row.warnr{border-left:3px solid var(--warn)}
.row.okr{background:#FAFAF8}
.rt{width:52px;flex:none;font-size:13px;font-weight:500;color:#5c5955;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--stone)}
.dot.pass{background:var(--pass)} .dot.fail{background:var(--fail)} .dot.warn{background:var(--warn)}
.rn{flex:1;min-width:0;font-size:15px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{font-size:13px;font-weight:300;color:#7a7771;flex:none}
.chip{font-size:11px;font-weight:500;padding:4px 9px;flex:none;letter-spacing:.04em}
.chip.pass{background:#E8F0EB;color:var(--pass)}
.chip.fail{background:#F6E5E3;color:var(--fail)}
.chip.warn{background:#F7EFDD;color:var(--warn)}
.chip.grey{background:var(--mist);color:#7a7771}
.station{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8a8681;
  width:96px;flex:none}

.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.btn{background:#fff;border:1px solid var(--stone);padding:10px 14px;font-size:14px;
  color:#5c5955;cursor:pointer;min-height:42px}
.btn.on{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.btn.cta{background:var(--clay);color:#fff;border-color:var(--clay);font-weight:500}
input[type=date]{border:1px solid var(--mist);background:#fff;padding:10px 12px;font-size:14px}
.empty{background:#fff;border:1px dashed var(--stone);padding:26px;text-align:center;
  font-size:14px;font-weight:300;color:#7a7771}

/* detail drawer */
.drawer{position:fixed;inset:0;background:rgba(34,34,34,.42);display:none;z-index:20;
  justify-content:flex-end}
.drawer.open{display:flex}
.dpanel{background:var(--sand);width:min(560px,100%);display:flex;flex-direction:column;overflow-y:auto}
.dhead{background:#fff;border-bottom:1px solid var(--mist);padding:20px 24px;position:sticky;top:0}
.dtitle{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:8px 0 4px}
.dmeta{font-size:13px;font-weight:300;color:#6d6a65;margin:0}
.dbody{padding:18px 24px 30px}
.line{background:#fff;border:1px solid var(--mist);padding:12px 15px;margin-bottom:6px;
  display:flex;align-items:center;gap:12px;font-size:14px}
.line .v{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.line .v.fail{color:var(--fail)} .line .v.pass{color:var(--pass)}
.line.skip{background:#FAF9F7;color:#8a8681}
.ca{background:#fff;border:1px solid var(--fail);border-left:4px solid var(--fail);
  padding:16px 18px;margin:14px 0}
.ca h3{font-size:15px;font-weight:600;color:var(--fail);margin:0 0 12px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 14px;font-size:13px}
.kv span{color:#8a8681;font-weight:300}
.kv b{font-weight:500}
.shot{margin-top:12px}
.shot img{max-width:100%;border:1px solid var(--mist);display:block}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px}
.lbox{background:#fff;border:1px solid var(--mist);padding:36px 38px;width:min(400px,100%)}
.lbox svg{width:84px;height:auto;fill:var(--charcoal);display:block;margin-bottom:26px}
.lbox h2{font-size:22px;font-weight:600;margin:0 0 6px}
.lbox p{font-size:13px;font-weight:300;color:#6d6a65;margin:0 0 22px;line-height:1.5}
.lbox label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:#7a7771;margin-bottom:6px}
.lbox input{width:100%;border:1px solid var(--mist);background:var(--sand);padding:12px 13px;
  font-size:15px;margin-bottom:16px}
.lbox button{width:100%;background:var(--charcoal);color:#fff;border:none;height:50px;
  font-size:16px;font-weight:500;cursor:pointer}
.lerr{background:#F6E5E3;color:var(--fail);padding:11px 14px;font-size:13px;margin-bottom:16px}
/* builder */
.dfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--mist);
  padding:14px 24px;display:flex;gap:10px;justify-content:flex-end}
.ask{margin-bottom:16px}
.asklab{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:#7a7771;margin-bottom:6px}
.finp{width:100%;border:1px solid var(--mist);background:#fff;padding:11px 12px;font-size:15px}
.finp.sm{width:auto;min-width:78px;flex:none}
.finp.tiny{font-size:13px;padding:8px 10px;background:var(--sand)}
.finp.ta{min-height:76px;resize:vertical;line-height:1.5}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.deg{font-size:13px;font-weight:300;color:#6d6a65;flex:none}
.irow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--mist);
  padding:10px 12px;margin-bottom:6px}
.irow.col{flex-direction:column;align-items:stretch;gap:6px}
.irowtop{display:flex;align-items:center;gap:8px}
.del{background:none;border:none;color:#9a9691;font-size:16px;cursor:pointer;padding:6px 8px;flex:none}
.del:hover{color:var(--fail)}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{font-size:13px;padding:10px 13px;background:#fff;border:1px solid var(--mist);
  cursor:pointer;color:var(--charcoal);min-height:42px}
.opt.on{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.pinbox{background:#FBEEEB;border:2px solid var(--clay);padding:22px;text-align:center;margin-bottom:22px}
.pinrow{display:flex;gap:9px;justify-content:center;margin-top:14px}
.pinbig{font-size:42px;font-weight:700;letter-spacing:.18em;font-variant-numeric:tabular-nums;margin:8px 0 8px}
.arealab{display:flex;align-items:center;gap:12px;margin:30px 0 12px}
.arealab .an{font-size:17px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.arealab .ln{flex:1;height:2px;background:var(--charcoal)}
.arealab .acount{font-size:12px;font-weight:300;color:#7a7771;flex:none}
.opt.photoreq{white-space:nowrap;font-size:12px;min-width:140px;text-align:center}
.opt.photoreq.on{background:var(--clay);border-color:var(--clay)}
.imgrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imgrow.standalone{margin:-2px 0 8px;padding:0 12px 10px}
.imgrow img{max-height:86px;border:1px solid var(--mist);display:block}
.dev{background:#fff;border:1px solid var(--mist);padding:18px 20px;margin-bottom:12px}
.dev.warn{border-color:var(--warn);border-left:4px solid var(--warn)}
.devhead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.devname{font-size:19px;font-weight:600}
.devarea{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a8681}
.link{display:flex;align-items:center;gap:12px;background:var(--sand);padding:10px 13px;margin-bottom:6px;font-size:13px}
.pulse{width:9px;height:9px;border-radius:50%;flex:none}
.pulse.on{background:var(--pass)} .pulse.stale{background:var(--warn)} .pulse.off{background:var(--stone)}
.linkua{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5c5955}
.codes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.code{font-size:15px;font-weight:600;letter-spacing:.14em;background:var(--warmstone);
  padding:9px 13px;font-variant-numeric:tabular-nums}
.code.used{background:var(--mist);color:#b5b1ab;text-decoration:line-through;font-weight:300}
.devbar{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center}
.act{display:flex;align-items:flex-start;gap:14px;background:#fff;border:1px solid var(--mist);
  padding:12px 16px;margin-bottom:5px}
.act.bad{border-left:3px solid var(--fail)}
.act.note{border-left:3px solid var(--warn)}
.actt{width:112px;flex:none;font-size:12px;font-weight:300;color:#8a8681;font-variant-numeric:tabular-nums}
.actv{width:150px;flex:none;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.actd{flex:1;min-width:0;font-size:14px;font-weight:300;color:#3f3c39}
.acta{font-size:12px;font-weight:300;color:#8a8681;flex:none}
.daysep{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a8681;
  margin:24px 0 9px;display:flex;align-items:center;gap:10px}
.daysep .ln{flex:1;height:1px;background:var(--mist)}
.hide{display:none !important}
.wbars{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.wbar{display:grid;grid-template-columns:170px 1fr 170px;gap:12px;align-items:center;font-size:14px}
.wtrack{position:relative;height:22px;background:#fff}
.wtrack i{position:absolute;left:0;top:0;bottom:7px;background:var(--clay)}
.wtrack b{position:absolute;left:0;bottom:0;height:5px;background:var(--stone)}
.wval{font-variant-numeric:tabular-nums}.wval small{color:#8a8681}
.wkey{font-size:12px;color:#8a8681;margin:6px 0 22px;display:flex;align-items:center;gap:6px}
.wkey i{display:inline-block;width:14px;height:10px;background:var(--clay)}
.wkey b{display:inline-block;width:14px;height:4px;background:var(--stone);margin-left:10px}
.wtablewrap{overflow-x:auto}
.wtable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.wtable th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a8681;font-weight:600;padding:0 12px 8px 0;border-bottom:1px solid var(--charcoal)}
.wtable td{padding:9px 12px 9px 0;border-bottom:1px solid var(--mist)}
@media (max-width:640px){.wbar{grid-template-columns:1fr;gap:4px}}
/* ---- Tasks: readable, one change at a time ---- */
.linkbtn{background:none;border:none;color:var(--clay);font-family:inherit;font-size:14px;cursor:pointer;padding:0;text-decoration:underline}
.tcrumb{margin:0 0 10px}
.trow .twhenc{width:150px;flex:none;font-size:13px;font-weight:500;color:#5c5955;font-variant-numeric:tabular-nums}
.trow .tdays{width:90px;text-align:right}
.tcard{background:#fff;border:1px solid var(--mist);padding:16px 18px;margin-bottom:12px}
.tcardh{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#7a7771;margin-bottom:8px}
.twhen{font-size:15px;margin:0;line-height:1.5}
.kv b{white-space:pre-wrap}
.tline{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--mist);padding:14px 16px;margin-bottom:6px}
.tnum{width:24px;flex:none;font-size:13px;font-weight:700;color:#b5b1ab;padding-top:2px}
.tbody{flex:1;min-width:0}
.ttext{font-size:16px;font-weight:500;line-height:1.35}
.tmeta{font-size:13px;color:#7a7771;margin-top:4px}
.thow{font-size:13px;color:#5c5955;background:var(--sand);padding:8px 10px;margin-top:8px;line-height:1.45}
.thow b{display:inline-block;width:18px;height:18px;border:1px solid var(--stone);border-radius:50%;text-align:center;font-size:11px;line-height:16px;margin-right:6px}
.tattach{margin-top:10px;border-left:3px solid var(--mist);padding-left:10px}
.tattl{font-size:12px;font-weight:600;color:#3d3b38;margin-bottom:4px}
.tgrp{margin:4px 0}
.tgrpl{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8a8681;margin-top:6px}
.titem{display:inline-block;font-size:13px;background:var(--sand);border:1px solid var(--mist);padding:3px 8px;margin:3px 4px 0 0}
.titem small{color:#8a8681}
.tacts{display:flex;align-items:center;gap:4px;flex:none}
.tbtn{background:#fff;border:1px solid var(--stone);width:34px;height:34px;font-size:15px;cursor:pointer;color:#3d3b38}
.tbtn:disabled{opacity:.3;cursor:default}
.tbtn.del{border-color:transparent;color:#9a9691}
.tbtn.del:hover{color:var(--fail)}
.tfoot{margin:22px 0 90px;font-size:14px;color:#8a8681}
.savebar{position:fixed;left:210px;right:0;bottom:0;background:#fff;border-top:2px solid var(--clay);padding:14px 30px;display:none;align-items:center;gap:12px;z-index:15;box-shadow:0 -4px 14px rgba(0,0,0,.05)}
.savebar.show{display:flex}
.savebar span{flex:1;font-size:15px;font-weight:500}
.savebar small{display:block;font-size:12px;font-weight:300;color:#7a7771}
.fhint{font-size:12px;color:#8a8681;margin:6px 0 0}
.ftbl{width:100%;border-collapse:collapse;margin-bottom:8px}
.ftbl th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#8a8681;text-align:left;padding:0 6px 6px 0}
.ftbl td{padding:3px 6px 3px 0;vertical-align:middle}
.ftbl .finp{padding:8px 9px;font-size:14px}
.nowrap{white-space:nowrap}
.imgrow{display:flex;align-items:center;gap:10px}
.imgrow img{max-width:120px;max-height:90px;border:1px solid var(--mist)}
.flash{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:12px 18px;font-size:14px;opacity:0;transition:opacity .25s;z-index:40;pointer-events:none}
.flash.show{opacity:1}
/* one side at a time */
.ttabs{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.ttab{flex:1;min-width:180px;text-align:left;background:#fff;border:1px solid var(--mist);border-top:4px solid var(--mist);padding:12px 16px;cursor:pointer;font-family:inherit}
.ttab b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em;color:#5c5955}
.ttab span{font-size:12px;color:#8a8681}
.ttab.on{border-color:var(--stone);border-top-color:var(--clay);background:#fff;box-shadow:0 2px 0 var(--charcoal)}
.ttab.on b{color:var(--charcoal)}
.tside{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 14px;padding-bottom:12px;border-bottom:2px solid var(--charcoal)}
.tside h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.tside p{font-size:13px;color:#7a7771;margin:2px 0 0}
/* the guided new task */
.zcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--mist);padding:16px 18px;margin-bottom:8px;cursor:pointer;font-family:inherit}
.zcard b{display:block;font-size:17px;font-weight:600}
.zcard span{font-size:13px;color:#7a7771}
.zcard.on{border:2px solid var(--charcoal);padding:15px 17px}
.zadd{display:flex;gap:8px;align-items:center;margin:12px 0 4px}
.zadd .finp:first-child{flex:1}
.zitem{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--mist);padding:9px 12px;margin-bottom:5px}
.zitem .zname{flex:1;font-size:15px}
.zfoot{display:flex;justify-content:space-between}
.tquick{background:#fff;border:1px dashed var(--stone);padding:10px;margin-top:8px}
@media (max-width:760px){
  .savebar{left:0;padding:12px 16px;flex-wrap:wrap}
  .tline{flex-wrap:wrap}
  .tacts{width:100%;justify-content:flex-end}
  .trow .twhenc{width:auto}
  .trow .tdays{display:none}
}
/* ---- menu groups ---- */
.navg{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a8a49e;padding:16px 18px 6px;font-weight:600}
/* ---- the shared vertical timeline ---- */
.arail{position:relative;padding:6px 0 30px 74px}
.arail:before{content:"";position:absolute;left:62px;top:0;bottom:0;width:2px;background:var(--stone)}
.aitem{position:relative}
.atime{position:absolute;left:-74px;top:14px;width:50px;text-align:right;font-size:13px;font-weight:600;color:#3d3b38;font-variant-numeric:tabular-nums}
.adot{position:absolute;left:-17px;top:16px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--charcoal)}
.acard{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 10px;width:100%;text-align:left;background:#fff;border:1px solid var(--mist);padding:12px 14px;margin:0;font-family:inherit;color:var(--charcoal);cursor:pointer}
.acard:hover{border-color:var(--stone)}
.atitle{flex:1;font-size:15px;font-weight:500}
.asub{flex-basis:100%;font-size:12px;color:#8a8681}
.amark{position:relative;height:0;margin-left:-74px}
.amark:before{content:"";position:absolute;left:0;right:0;top:0;border-top:2px solid var(--clay)}
.amark span{position:absolute;left:74px;top:-11px;background:var(--clay);color:#fff;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px}
.amark.doors:before{border-top:1px dashed var(--clay)}
.amark.doors span{background:#fff;color:var(--clay);border:1px solid var(--clay)}
.aany{border:1px dashed var(--stone);background:#fff;padding:10px;margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
.aanyh{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8a8681}
.acard.st-done,.acard.st-donelate{background:#F7F9F7}
.acard.st-late,.acard.st-missed{border:2px solid var(--fail);border-left:6px solid var(--fail)}
.acard.st-part{border:2px solid var(--warn)}
.acard.st-now{border:2px solid var(--clay)}
.adot.st-done,.adot.st-donelate{background:var(--pass);border-color:var(--pass)}
.adot.st-late,.adot.st-missed{border-color:var(--fail)}
/* ---- today / records ---- */
.needs{background:#fff;border:2px solid var(--fail);padding:12px 14px;margin-bottom:18px}
.needs.calm{border:1px solid var(--mist)}
.needsh{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fail);margin-bottom:6px}
.needs.calm .needsh{color:var(--pass);margin:0}
.needrow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-top:1px solid var(--mist);padding:10px 2px;font-family:inherit;font-size:14px;text-align:left;cursor:pointer}
.tsays{font-size:14px;color:#5c5955;margin:0 0 12px}
.tsays .bad,.bad{color:var(--fail)}
.recbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.recbar input[type=date]{border:1px solid var(--stone);padding:9px 10px;font-family:inherit;font-size:14px}
.itbl{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.itbl th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8a8681;padding:8px;border-bottom:1px solid var(--charcoal)}
.itbl td{padding:7px 8px;border-bottom:1px solid var(--mist);vertical-align:top}
.itbl tr.ifail td{background:#FBF0EF}
.devcodes{margin-top:12px}
.devcodes summary{cursor:pointer;font-size:13px;color:#5c5955}
@media print{
  .side,.noprint,.savebar,.drawer{display:none !important}
  .main{padding:0}
  body{background:#fff}
}
@media (max-width:760px){
  .wrap{flex-direction:column}
  .side{width:auto;height:auto;align-self:stretch;border-right:none;border-bottom:1px solid var(--mist);padding:10px 0 0;display:flex;flex-wrap:nowrap;overflow-x:auto;align-items:center;position:sticky;top:0;z-index:10}
  .side .brand{padding:0 12px 8px}
  .side .brand svg{width:54px}
  .navg{display:none}
  .nav{width:auto;white-space:nowrap;padding:10px 12px;border-left:none;border-bottom:3px solid transparent}
  .nav.on{border-bottom-color:var(--clay)}
  .side .who{position:static;width:auto;white-space:nowrap;padding:8px 12px;font-size:11px}
  .main{padding:18px 16px 60px;max-width:100vw;overflow-x:hidden}
  .row,.needrow,.acard{flex-wrap:wrap;height:auto;min-height:48px}
  .row .rn{white-space:normal;flex-basis:60%}
  .ttab{min-width:0;flex:1 1 40%;padding:10px 12px}
  .ttab b{font-size:16px}
  .tside{align-items:flex-start}
  .itbl{display:block;overflow-x:auto}
  .arail{padding-left:60px}
  .arail:before{left:50px}
  .atime{left:-60px;width:42px}
  .amark{margin-left:-60px}
  .amark span{left:60px}
}
</style>
</head>
